cube_height: 0.030                  # Full height of each chess piece collision cube (m)
grasp_z: 0.430                      # Gripper Z target for both grasp and place plunge phases
hover_z: 0.460                      # Gripper Z where RL descend/ascend stages stop; arm idles here before grasp/place
safe_z: 0.530                       # Transit height; arm travels between squares at this Z
success_threshold: 0.010            # Distance (m) from goal at which an RL stage is considered successful
success_bonus: 500.0                # Sparse reward added when an episode ends in success
drift_limit_start: 0.100            # Initial XY tube radius for descend/ascend drift curriculum
drift_limit_end: 0.008              # Final XY tube radius after drift curriculum has fully tightened
drift_curriculum_steps: 30000       # Per-worker environment steps over which the tube tightens to drift_limit_end
floor_limit: 0.400                  # Minimum allowable gripper Z for transit; below this triggers FLOOR_HIT
crash_penalty: -500.0               # Sparse penalty applied on any crash termination
hidden_object_pos: [2.0, 2.0, 0.015]  # Off-table position used to hide object0 during chess play
table_surface_z: 0.400              # Z coordinate of the table surface; equals floor_limit
table_center_xy: [0.88, 0.2641]     # XY world coordinate of the table centre; board geometry lives in chess.yaml
table_half_x: 0.35                  # Half-extent of the table in world X (70 cm total)
table_half_y: 0.35                  # Half-extent of the table in world Y (70 cm total)
edge_margin: 0.04                   # Inset margin from table edges used when sampling random training positions
torso_height: 0.3700                # Fetch torso_lift_joint position; tuned for full-board arm reachability
min_goal_dist: 0.10                 # Minimum XY separation required between object and sampled training goal

# Home Position
home_position_xy: [0.88, 0.2641]    # XY the arm returns to after each chess move; matches board centre

# Grasp Phase Thresholds
grasp_align_tolerance: 0.001        # Maximum XY error (m) allowed before the grasp/place plunge begins
grasp_close_steps: 24               # Number of actuator steps used to ramp fingers from open to grip target
grasp_ramp_end: 0.010               # Finger joint target at end of close ramp; stalls here when cube is present
empty_grasp_threshold: 0.011        # If finger joint falls below this during close the cube is absent
grasp_hold_steps: 2                 # Physics steps to hold grip after close so contact impulses settle
grasp_plunge_step_m: 0.006          # Vertical step size (m) per physics step during grasp/place plunge
grasp_retract_step_m: 0.006         # Vertical step size (m) per physics step during post-grasp/place retract
release_ramp_steps: 4               # Steps over which fingers open from grip target to fully open during place
release_settle_steps: 2             # Steps to hold fingers fully open before placement is verified
grasp_verify_xy_threshold: 0.015    # Maximum cube-to-grip XY distance (m) accepted as a successful grasp
grasp_verify_z_threshold: 0.020     # Maximum cube-to-grip Z distance (m) accepted as a successful grasp

# piece Hold Monitoring
piece_held_xy_limit: 0.030           # XY distance (m) between piece and gripper that triggers PIECE_DROPPED_XY
piece_held_z_limit: 0.020            # Z distance (m) between piece and gripper that triggers PIECE_DROPPED_Z

rl_max_steps_per_stage: 300         # Maximum SAC inference steps per stage before TIMEOUT is declared

# Post-place reconciliation
reconcile_xy_tolerance_m: 0.020     # Maximum XY error (m) between final piece position and destination square
reconcile_z_tolerance_m: 0.010      # Maximum Z error (m) between final piece position and table surface

logging:
  level: "INFO"                     # Log level for the environment logger
  log_dir: "logs/env_debug"         # Directory where per-process debug log files are written

# Task Thresholds
stability_vel_threshold: 0.02       # Grip speed (m/s) below which the arm is considered stable for success
braking_dist: 0.010                 # Fallback braking zone (m) when no stage-specific key is present
floor_proximity_threshold: 0.025    # Safety margin (m) above floor_limit that triggers the floor proximity penalty

# Stage-specific braking distances
transit_braking_dist: 0.030         # Transit: distance from goal at which velocity penalty begins
descend_braking_dist: 0.025         # Descend: distance from HOVER_Z at which velocity penalty begins
ascend_braking_dist: 0.010          # Ascend: distance from SAFE_Z at which velocity penalty begins

# Descend success criterion
descend_success_threshold: 0.008    # Tighter Z threshold (m) for descend success; forces genuine convergence

# Reward Weights & Penalties
z_reward_weight: 1.5                # Dense reward weight for Z-axis proximity to goal
xy_reward_weight: 2.0               # Dense reward weight for XY proximity to goal
jitter_penalty_weight: 0.003        # Penalty coefficient applied to squared XYZ action magnitude
floor_penalty: 0.5                 # Constant penalty added when gripper is within floor_proximity_threshold of floor_limit
braking_reward_weight: 0.15         # Fallback velocity penalty weight when no stage-specific key is present
transit_braking_reward_weight: 0.50 # Transit velocity penalty weight near goal
descend_braking_reward_weight: 0.30 # Descend velocity penalty weight near HOVER_Z
ascend_braking_reward_weight: 0.15  # Ascend velocity penalty weight near SAFE_Z
dist_reward_weight: 1.0             # Dense reward weight for total distance to goal

# Gripper Constants
eval_drift_limit: 0.010             # Fixed XY tube radius (m) used during evaluation runs

# Actuator Enforcement
finger_open_joint: 0.0181           # l_gripper_finger_joint position for fully open fingers
finger_closed_joint: 0.0000         # l_gripper_finger_joint position for fully closed fingers

# Transition Thresholds
halt_vel_threshold: 0.0005          # Maximum gripper speed (m/s) to consider the arm stopped during a stage transition
