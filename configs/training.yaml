# Base pretrained model (FetchPickAndPlace-v4 transfer weights)
base_model: "archive/rl_system/models/sac-FetchPickAndPlace-v4.zip"

# Parallelism
num_envs: 4

# Training length
# Use 600K for specialist training sessions (transit/descend/ascend).
total_timesteps: 600000

# SAC fine-tuning hyperparameters
learning_rate: 0.00005
batch_size: 512
target_entropy: -4.0
learning_starts: 10000
buffer_size: 300000

# Entropy reset on model load
initial_ent_coef: 0.1
ent_coef_lr: 0.001

# Evaluation
# NOTE: 5 eval episodes is too noisy (a 70% model can pass 5/5 by chance).
# Use 20+ for reliable best-model tracking. eval_freq every 50K steps.
eval_freq: 50000
n_eval_episodes: 20

# Logging
log_freq: 2000
moving_avg_window: 100

# Optional model path registry for eval/integration scripts.
deployed_models:
  # Selected by repeated direct eval on 2026-05-24.
  transit: "checkpoints/transit_20260524_084201/latest_model_transit.zip"
  descend: "checkpoints/descend_20260523_222907/latest_model_descend.zip"
  ascend: "checkpoints/ascend_20260523_222849/best_model_ascend.zip"
