vertical_quat: [0.7071068, 0.0, 0.7071068, 0.0]  # Unit quaternion for downward gripper orientation (90° rotation about Y)
initial_qpos: [-0.05, 0.00]        # Initial Fetch base slide positions to centre the arm over the board

env_setup_steps: 10                 # Physics settle steps run during initial env setup before the first episode
max_goal_retries: 100               # Maximum attempts to sample a valid non-overlapping training goal
pos_ctrl_scale: 0.015               # Maximum arm displacement (m) applied per action step

settle_tolerance: 0.003             # Gripper position tolerance (m) used when moving to a waypoint with _move_mocap_to
