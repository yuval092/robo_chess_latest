board:
  cell_size_m: 0.08                 # Physical width of one chess square in metres
  board_size: 8                     # Number of squares along one edge (standard 8x8)
  center_xy: [0.88, 0.2641]         # World XY coordinate of the board centre

pieces:
  cube_height_m: 0.030              # Full height of the collision cube; piece centre rests at table_surface_z + 0.015

reserves:
  graveyard_slot_spacing_m: 0.045   # Centre-to-centre spacing between slots in the graveyard grid
  promotion_slot_spacing_m: 0.045   # Centre-to-centre spacing between slots in the promotion reserve grid

graveyards:
  white:
    origin_xyz: [0.640, -0.300, 0.015]  # World XYZ of the first white graveyard slot (slot_00)
    rows: 4                             # Number of rows in the white graveyard grid
    cols: 4                             # Number of columns in the white graveyard grid
  black:
    origin_xyz: [0.640, 0.680, 0.015]   # World XYZ of the first black graveyard slot (slot_00)
    rows: 4
    cols: 4

promotion_reserve:
  white:
    origin_xyz: [0.820, -0.300, 0.015]  # World XYZ of the first white promotion reserve slot (slot_00)
    rows: 8                             # Number of rows in the white promotion reserve grid
    cols: 4                             # Number of columns in the white promotion reserve grid
  black:
    origin_xyz: [0.820, 0.680, 0.015]   # World XYZ of the first black promotion reserve slot (slot_00)
    rows: 8
    cols: 4

game:
  human_color: white                # Side the human controls: "white", "black", or "both"
  auto_computer_reply: true         # If true, the engine automatically replies after each successful human move

engine:
  stockfish_path: stockfish         # Stockfish executable name on PATH, or a full file path; null disables the engine
  skill_level: 5                    # UCI Skill Level option (0 = weakest, 20 = full strength)
  think_time_s: 0.5                 # Seconds Stockfish may search per move
