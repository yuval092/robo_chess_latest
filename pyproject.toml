[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-chess"
version = "1.0.0"
description = "RoboChess: MuJoCo-based robot arm chess controller"
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "gymnasium-robotics",
    "mujoco",
    "numpy",
    "python-chess",
    "flask",
    "pyyaml",
    "stable-baselines3",
    "huggingface_hub",
    "Tensorboard",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "chess_env*", "training*"]

[tool.setuptools.package-data]
"chess_env" = ["assets/*.xml", "stls/chess/*.stl", "stls/fetch/*.stl"]

[project.scripts]
robo-chess-train = "training.main:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "chess_env", "training"]
