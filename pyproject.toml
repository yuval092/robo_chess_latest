[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-chess"
version = "0.1.0"
description = "RoboChess: MuJoCo-based robot arm chess controller"
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "gymnasium-robotics",
    "mujoco",
    "numpy",
    "python-chess",
    "flask",
    "pyyaml",
    "stable-baselines3",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "chess_env*", "training*"]

[tool.setuptools.package-data]
"chess_env" = ["assets/*.xml", "stls/**/*.stl"]

[project.scripts]
# Production
robo-chess-play         = "src.cli.play:main"
robo-chess-generate     = "src.cli.generate_scene:main"
# Evaluation
robo-chess-eval-stage   = "src.cli.eval_stage:main"
robo-chess-eval-physics = "src.cli.eval_physics:main"
robo-chess-eval-flow    = "src.cli.eval_flow:main"
# Training
robo-chess-train        = "training.cli.main:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "chess_env", "training"]
